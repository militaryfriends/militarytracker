name: 웹 미리보기 배포

# 본 사이트(military-tracker-96bdd.web.app)는 건드리지 않고
# 임시 주소(미리보기 채널)에만 올린다. 14일 뒤 자동 삭제.
# (claude/visual-fix 브랜치 전용) patches/*.b64 가 있으면 먼저 적용해 이 브랜치에 커밋한 뒤 빌드한다.
#   b64 = git diff | gzip | base64 — 클라우드에서 git push 를 못 해서 웹 편집기로 패치 한 파일만 올린다.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "미리보기 채널 이름 (영문·숫자·하이픈)"
        required: false
        default: "preview"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 패치 적용 (patches/*.b64)
        run: |
          shopt -s nullglob
          files=(patches/*.b64)
          if [ ${#files[@]} -gt 0 ]; then
            git config user.name "claude (overnight)"
            git config user.email "noreply@anthropic.com"
            for f in "${files[@]}"; do
              echo "apply $f"
              base64 -d "$f" | gunzip | git apply --whitespace=nowarn
            done
            git rm -q "${files[@]}"
            git add -A
            git commit -q -m "patches 적용: ${files[*]}"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npx expo export --platform web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_PREVIEW_KEY }}
          projectId: military-tracker-96bdd
          channelId: ${{ inputs.channel || 'preview' }}
          expires: 14d
